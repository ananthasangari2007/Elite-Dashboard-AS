<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Elite Batch Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="app-shell">
        {% block body %}{% endblock %}
    </div>

    <div class="modal fade proof-modal" id="proofModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content proof-modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Submission Proof Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body proof-modal-body" id="proofModalBody"></div>
                <div class="modal-footer proof-modal-footer">
                    <button type="button" class="ghost-btn" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-stack">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="app-toast toast-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const chartEndpoint = "{{ url_for('dashboard.chart_data') }}";
            if (!chartEndpoint) return;
            fetch(chartEndpoint)
                .then((response) => response.ok ? response.json() : null)
                .then((payload) => {
                    if (!payload) return;
                    const palette = ["#2563eb", "#22c55e", "#f59e0b", "#ef4444", "#8b5cf6", "#14b8a6", "#f97316", "#ec4899"];

                    if (payload.role === "admin") {
                        const bar = document.getElementById("adminTopStudentsChart");
                        if (bar && payload.top_students) new Chart(bar, { type: "bar", data: { labels: payload.top_students.labels, datasets: [{ label: "Overall points", data: payload.top_students.values, backgroundColor: palette }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });

                        const pie = document.getElementById("adminTaskDistributionChart");
                        if (pie && payload.task_distribution) new Chart(pie, { type: "pie", data: { labels: payload.task_distribution.labels, datasets: [{ data: payload.task_distribution.values, backgroundColor: palette }] }, options: { responsive: true } });

                        const line = document.getElementById("adminApprovalTrendChart");
                        if (line && payload.approval_trend) new Chart(line, { type: "line", data: { labels: payload.approval_trend.labels, datasets: [{ label: "Approved tasks", data: payload.approval_trend.values, borderColor: "#2563eb", backgroundColor: "rgba(37,99,235,0.18)", fill: true, tension: 0.25 }] }, options: { responsive: true, scales: { y: { beginAtZero: true } } } });

                        const doughnut = document.getElementById("adminSubmissionStatusChart");
                        if (doughnut && payload.submission_status) new Chart(doughnut, { type: "doughnut", data: { labels: payload.submission_status.labels, datasets: [{ data: payload.submission_status.values, backgroundColor: palette }] }, options: { responsive: true } });

                        const taskPerformance = document.getElementById("adminTaskPerformanceChart");
                        if (taskPerformance && payload.task_performance) new Chart(taskPerformance, {
                            type: "bar",
                            data: {
                                labels: payload.task_performance.labels,
                                datasets: [{
                                    label: "Approved submissions",
                                    data: payload.task_performance.values,
                                    backgroundColor: payload.task_performance.values.map((value) => value > 0 ? "#2563eb" : "#d1d5db"),
                                }],
                            },
                            options: {
                                responsive: true,
                                indexAxis: "x",
                                plugins: { legend: { display: false } },
                                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
                            },
                        });
                    }
                })
                .catch(() => {});
        });
    </script>
</body>
</html>
